<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1a2c"/>
      <stop offset="55%" stop-color="#12314f"/>
      <stop offset="100%" stop-color="#1b4066"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7a1a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff7a1a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b3d52"/>
      <stop offset="100%" stop-color="#0e1c2b"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1280" cy="230" r="320" fill="url(#glow)"/>

  <!-- distant skyline -->
  <g fill="#0c2033" opacity="0.85">
    <rect x="60" y="470" width="120" height="240"/>
    <rect x="200" y="420" width="90" height="290"/>
    <rect x="310" y="500" width="140" height="210"/>
    <rect x="470" y="450" width="70" height="260"/>
    <rect x="560" y="520" width="110" height="190"/>
    <rect x="1180" y="480" width="120" height="230"/>
    <rect x="1320" y="430" width="90" height="280"/>
    <rect x="1430" y="510" width="120" height="200"/>
  </g>

  <!-- road -->
  <path d="M0 690 H1600 V900 H0 Z" fill="url(#road)"/>
  <path d="M0 690 H1600" stroke="#3a5170" stroke-width="3"/>
  <g stroke="#ffb066" stroke-width="7" stroke-dasharray="60 46" opacity="0.85">
    <path d="M20 810 H1580"/>
  </g>

  <!-- bus -->
  <g transform="translate(430 480)">
    <rect x="0" y="40" width="620" height="200" rx="26" fill="#f4f7fb"/>
    <rect x="0" y="40" width="620" height="72" rx="26" fill="#1d3f66"/>
    <rect x="18" y="56" width="120" height="44" rx="10" fill="#8fc2ff" opacity="0.85"/>
    <rect x="152" y="56" width="120" height="44" rx="10" fill="#8fc2ff" opacity="0.7"/>
    <rect x="286" y="56" width="120" height="44" rx="10" fill="#8fc2ff" opacity="0.75"/>
    <rect x="420" y="56" width="182" height="44" rx="10" fill="#8fc2ff" opacity="0.6"/>
    <rect x="40" y="150" width="240" height="64" rx="12" fill="#dbe6f2"/>
    <rect x="300" y="150" width="140" height="64" rx="12" fill="#dbe6f2"/>
    <circle cx="130" cy="252" r="42" fill="#101c2b"/>
    <circle cx="130" cy="252" r="18" fill="#9fb3c8"/>
    <circle cx="500" cy="252" r="42" fill="#101c2b"/>
    <circle cx="500" cy="252" r="18" fill="#9fb3c8"/>
    <rect x="580" y="120" width="46" height="26" rx="10" fill="#ff7a1a"/>
    <rect x="0" y="120" width="40" height="26" rx="10" fill="#ffcc99"/>
  </g>

  <!-- foreground glow -->
  <rect width="1600" height="900" fill="url(#glow)" opacity="0.35"/>
</svg>
